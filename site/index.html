<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="A place to leave traces.">
  <meta property="og:description" content="Wander in.">
  <meta property="og:image" content="https://jiqi-kiara.com/og-image.jpg">
  <meta property="og:url" content="https://jiqi-kiara.com">
  <meta property="og:type" content="website">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --rose-muted: #8a6b6b;
      --rose-dark: #6b4f4f;
      --cream: #f7f3f0;
      --index-ease: cubic-bezier(.18, .72, .22, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--cream);
      color: var(--rose-dark);
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: 72vh;
      background-image: url("IMG_3697.JPG");
      background-size: cover;
      background-position: center;
      position: relative;
      opacity: 0;
      filter: blur(1.5px) saturate(.96) brightness(1.04);
      transform-origin: center center;
      animation:
        indexImageReveal 1.15s var(--index-ease) both,
        indexImageBreath 18s ease-in-out 1.15s infinite alternate;
    }

    body.leaving .hero-image {
      animation-play-state: paused;
    }

    .hero-image::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 140px;
      background: linear-gradient(to bottom, rgba(247,243,240,0) 30%, var(--cream) 100%);
    }

    .content {
      position: absolute;
      left: 50%;
      bottom: 5vh;
      transform: translateX(-50%);
      text-align: center;
      width: 90%;
      max-width: 700px;
      z-index: 2;
    }

    .content h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 48px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.02em;
      margin: 52px 0 28px;
      color: var(--rose-dark);
      opacity: 0;
      filter: blur(2px);
      transform: translateY(9px);
      animation: indexInkAppear .9s var(--index-ease) .38s both;
    }

    /* ── 镂空描边按钮 ── */
    .enter-btn {
      position: relative;
      display: inline-block;
      padding: 13px 38px;
      border-radius: 999px;
      border: 1.5px solid var(--rose-muted);
      background: transparent;
      color: var(--rose-muted);
      text-decoration: none;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      overflow: visible;
      opacity: 0;
      filter: blur(1.5px);
      transform: translateY(7px);
      animation: indexInkAppear .86s var(--index-ease) .58s both;
      transition: color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .enter-btn:hover {
      color: var(--rose-dark);
      border-color: var(--rose-dark);
      box-shadow: 0 0 0 4px rgba(138, 107, 107, 0.08);
      transform: translateY(-1px);
    }

    /* 点击时的向外扩散光环 */
    .enter-btn::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 999px;
      border: 1.5px solid var(--rose-muted);
      opacity: 0;
      pointer-events: none;
    }

    .enter-btn.clicked::after {
      animation: ring-expand 0.6s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }

    .enter-btn.clicked {
      opacity: 1;
      filter: none;
      transform: translateY(0);
      animation: btn-pulse 0.6s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }

    @keyframes indexImageReveal {
      0%   { opacity: 0; filter: blur(1.5px) saturate(.96) brightness(1.04); }
      100% { opacity: 1; filter: blur(0) saturate(1) brightness(1); }
    }

    @keyframes indexImageBreath {
      0%   { transform: scale(1.006); }
      100% { transform: scale(1.024); }
    }

    @keyframes indexInkAppear {
      0%   { opacity: 0; filter: blur(2px); transform: translateY(9px); }
      100% { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    @keyframes ring-expand {
      0%   { transform: scale(1);    opacity: 0.7; }
      100% { transform: scale(1.55); opacity: 0;   }
    }

    @keyframes btn-pulse {
      0%   { box-shadow: 0 0 0 0   rgba(138,107,107,0.0); }
      30%  { box-shadow: 0 0 0 8px rgba(138,107,107,0.12); }
      100% { box-shadow: 0 0 0 16px rgba(138,107,107,0.0); }
    }

    .corner-note {
      position: fixed;
      bottom: 18px;
      right: 24px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      font-style: italic;
      color: rgba(107, 79, 79, 0.35);
      letter-spacing: 0.04em;
      pointer-events: none;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .hero-image { height: 58vh; }
      .content { bottom: 10vh; }
      .content h1 { font-size: 30px; margin-top: 20px; }
      .corner-note { bottom: 4px; right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-image,
      .content h1,
      .enter-btn {
        opacity: 1 !important;
        filter: none !important;
        animation: none !important;
        transform: none !important;
      }

      .enter-btn:hover {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-image"></div>
    <div class="content">
      <h1>A place to leave traces.</h1>
      <a href="home.html" class="enter-btn" id="enterBtn">Wander In.</a>
    </div>
  </section>
  <div class="corner-note"> </div>

  <script>
    const btn = document.getElementById('enterBtn');
    let isLeaving = false;

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      if (isLeaving) return;
      isLeaving = true;
      document.body.classList.add('leaving');
      btn.classList.remove('clicked');
      void btn.offsetWidth; // reflow to restart animation
      btn.classList.add('clicked');
      window.setTimeout(() => {
        window.location.href = btn.href;
      }, 620);
    });
  </script>

  <script data-goatcounter="https://kiara-mytrace.goatcounter.com/count"
      async src="https://gc.zgo.at/count.js"></script>
  <script>
    (function() {
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(d => {
          console.log("Session Log:", {
            timestamp: new Date().toISOString(),
            location: `${d.city}, ${d.region}, ${d.country_name}`,
            network: d.org,
            resolution: `${window.innerWidth}px`,
            referrer: document.referrer || "direct"
          });
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
