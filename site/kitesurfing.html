<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kite surfing</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fcfbf8; color: #6e4a4a; font-family: "Times New Roman", Georgia, serif; overflow-x: hidden; }

    .wind-field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .wind-field::before, .wind-field::after { content: ""; position: absolute; }
    .wind-field::before { width: 96vw; height: 30vh; left: -48vw; top: -18vh; border-radius: 999px; background: radial-gradient(ellipse at 54% 42%, rgba(255,255,255,.50) 0%, rgba(255,255,255,.28) 24%, transparent 52%), linear-gradient(90deg, transparent 0%, rgba(124,191,214,.10) 16%, rgba(162,216,230,.20) 32%, rgba(255,255,255,.34) 49%, rgba(132,199,220,.22) 68%, transparent 100%); box-shadow: inset 0 18px 26px rgba(255,255,255,.26), inset 0 -18px 32px rgba(116,180,204,.15), 0 18px 54px rgba(122,184,205,.14); filter: blur(2.8px); transform: rotate(-32deg); transform-origin: center; animation: diagonalWindBand 30s linear infinite; }
    .wind-field::after { inset: 0; background: linear-gradient(0deg, rgba(145,210,220,.16) 0%, rgba(255,255,255,.12) 28%, transparent 56%); animation: seaSurfaceBreath 42s ease-in-out infinite; }
    @keyframes diagonalWindBand { 0% { opacity: .50; left: -48vw; top: -18vh; } 50% { opacity: .80; left: 42vw; top: 58vh; } 100% { opacity: .50; left: -48vw; top: -18vh; } }
    @keyframes seaSurfaceBreath { 0%,100% { opacity: .24; transform: translateY(2vh); } 50% { opacity: .46; transform: translateY(-1.5vh); } }

    .page { max-width: 1280px; margin: 0 auto; padding: 28px 28px 90px; position: relative; z-index: 1; }
    .topline { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 36px; }
    .site-note { font-size: 16px; color: rgba(122,87,87,.78); font-style: italic; letter-spacing: .3px; }
    .search-btn { text-decoration: none; color: #8a6666; font-size: 28px; line-height: 1; }
    .title-wrap { margin-bottom: 30px; opacity: 0; filter: blur(6px); transform: translateY(12px); transition: opacity .95s ease-out, filter .95s ease-out, transform .95s ease-out; }
    .title-wrap.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
    .page-title { margin: 0; font-size: 56px; font-style: italic; font-weight: 500; color: #8b5e5e; line-height: 1.05; }
    .back-link { display: inline-block; margin-top: 10px; text-decoration: none; color: rgba(122,87,87,.75); font-size: 15px; }
    .layout { display: grid; grid-template-columns: 72px 1fr; gap: 22px; align-items: start; }
    .timeline-side { position: sticky; top: 30px; height: 100%; min-height: 500px; display: flex; justify-content: center; }
    .timeline-line { position: relative; width: 1px; background: rgba(122,87,87,.35); min-height: 700px; }
    .timeline-top, .timeline-bottom { position: absolute; left: -22px; font-size: 16px; color: rgba(122,87,87,.78); writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; }
    .timeline-top { top: 0; }
    .timeline-bottom { bottom: 0; }
    .entries { display: flex; flex-direction: column; gap: 72px; }
    .entry { display: grid; grid-template-columns: 280px max-content 220px; column-gap: 38px; row-gap: 0; align-items: start; opacity: .34; filter: blur(4px); transform: translateY(10px); transition: opacity .9s ease-out, filter .9s ease-out, transform .9s ease-out; }
    .entry.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
    .entry-meta { font-size: 30px; color: #9a6666; margin-bottom: 18px; line-height: 1.2; }
    .entry-meta .dot { font-size: 36px; vertical-align: middle; margin-right: 10px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 170px); gap: 20px; margin-top: 10px; align-items: start; }
    .photo-grid.photo-layout-single { grid-template-columns: 360px; }
    .photo-grid.photo-layout-2x2 { grid-template-columns: repeat(2, 170px); }
    .photo-thumb { width: 170px; height: 170px; position: relative; display: block; perspective: 780px; cursor: pointer; }
    .photo-grid.photo-layout-single .photo-thumb { width: 360px; height: 360px; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; background: white; display: block; transform-origin: 14% 88%; box-shadow: 0 1px 2px rgba(122,87,87,.10); transition: transform 1.15s cubic-bezier(.22,.61,.36,1), box-shadow 1.15s ease-out, filter 1.15s ease-out; will-change: transform; }
    .photo-thumb:hover img, .photo-thumb.is-wind-lift img { transform: rotate3d(-1,1,0,5.5deg) translateZ(2px); box-shadow: 5px -7px 16px rgba(122,87,87,.14); filter: brightness(1.015); }
    .photo-thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,.20) 42%, rgba(194,226,236,.14) 52%, transparent 68%); transform: translateX(-28%); transition: opacity 1.1s ease-out, transform 1.1s cubic-bezier(.22,.61,.36,1); }
    .photo-thumb:hover::after, .photo-thumb.is-wind-lift::after { opacity: .62; transform: translateX(24%); }
    .video-cell { width: 170px; height: 170px; position: relative; flex-shrink: 0; }
    .video-cell iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .right-col { padding-top: 52px; margin-left: 48px; }
    .entry-note { font-size: 15px; line-height: 1.95; color: rgba(122,87,87,.75); max-width: 220px; padding: 4px 0 4px 22px; border-left: 1px solid rgba(122,87,87,.22); }
    .page-footer { text-align: center; margin-top: 100px; position: relative; z-index: 1; top: -24px; font-size: 14px; font-style: italic; letter-spacing: 1px; color: rgba(122,87,87,.7); }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 26px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s ease, visibility .4s ease; }
    #lightbox.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    #lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; background: white; box-shadow: 0 20px 60px rgba(0,0,0,.4); filter: blur(10px); transform: scale(.97); transition: filter .5s ease-out, transform .5s ease-out; }
    #lightbox.is-open img { filter: blur(0); transform: scale(1); }
    .close-tip { position: absolute; top: 24px; right: 28px; color: rgba(255,255,255,.84); font-size: 14px; letter-spacing: 1px; }
    @media (prefers-reduced-motion: reduce) { .wind-field::before, .wind-field::after, .title-wrap, .entry { opacity: 1; filter: none; transform: none; animation: none; transition: none; } .wind-field::before, .wind-field::after { opacity: .34; } .photo-thumb img, .photo-thumb::after, #lightbox, #lightbox img { transition: none; } .photo-thumb:hover img, .photo-thumb.is-wind-lift img, #lightbox img { filter: none; transform: none; } .photo-thumb::after { display: none; } }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .timeline-side { display: none; } .entry { grid-template-columns: 1fr; row-gap: 16px; } .right-col { padding-top: 0; margin-left: 0; } .entry-meta { grid-column: span 1; font-size: 24px; } .page-title { font-size: 42px; } .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } .photo-grid.photo-layout-single { grid-template-columns: 1fr; } .photo-grid.photo-layout-2x2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .photo-thumb, .photo-grid.photo-layout-single .photo-thumb { width: 100%; height: 120px; } .photo-grid.photo-layout-single .photo-thumb { height: min(72vw, 360px); } .video-cell { width: 100%; height: 120px; } .entry-note { max-width: none; padding-left: 18px; } }
  </style>
</head>
<body>
  <div class="wind-field" aria-hidden="true"></div>
  <div class="page">
    <div class="topline"><div class="site-note">A place to leave traces.</div><a href="#" class="search-btn" aria-label="Search" id="search-icon">⌕</a></div>
    <div class="title-wrap"><h1 class="page-title">Kite surfing</h1><a href="into-the-wild.html" class="back-link">← Back</a></div>
    <div class="layout"><div class="timeline-side"><div class="timeline-line"><div class="timeline-top">NEW</div><div class="timeline-bottom">OLD</div></div></div><div class="entries" id="entries"></div></div>
  </div>
  <div class="page-footer">“如果那天，平静无风”</div>
  <div id="lightbox" onclick="closeLightbox()"><div class="close-tip">tap anywhere to close</div><img id="lightbox-img" src="" alt="large preview"></div>
  <script>
    function revealTitle(){const title=document.querySelector('.title-wrap');if(!title)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){title.classList.add('is-visible');return;}requestAnimationFrame(()=>title.classList.add('is-visible'));}
    function setupEntryReveal(){const entries=document.querySelectorAll('.entry');if(!entries.length)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver'in window)){entries.forEach(entry=>entry.classList.add('is-visible'));return;}const observer=new IntersectionObserver(items=>{items.forEach(item=>{if(item.isIntersecting){item.target.classList.add('is-visible');observer.unobserve(item.target);}});},{threshold:.15,rootMargin:'0px 0px -6% 0px'});entries.forEach(entry=>observer.observe(entry));}
    function setupTouchWindLift(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(!window.matchMedia('(hover: none), (pointer: coarse)').matches)return;document.querySelectorAll('.photo-thumb').forEach(target=>{target.addEventListener('pointerdown',()=>{target.classList.remove('is-wind-lift');void target.offsetWidth;target.classList.add('is-wind-lift');clearTimeout(target._windTimer);target._windTimer=setTimeout(()=>target.classList.remove('is-wind-lift'),1450);},{passive:true});});}
    function openLightbox(src){const lb=document.getElementById('lightbox');const lbImg=document.getElementById('lightbox-img');lbImg.src=src;lb.classList.remove('is-open');requestAnimationFrame(()=>lb.classList.add('is-open'));}
    async function loadEntries(){const res=await fetch('/kitesurfing.json');const data=await res.json();data.entries.sort((a,b)=>{const da=(a.date||'').replace(/\./g,'');const db=(b.date||'').replace(/\./g,'');return db.localeCompare(da);});const container=document.getElementById('entries');data.entries.forEach(e=>{const photos=e.photos||[];const photoLayout=photos.length===1?'photo-layout-single':((photos.length===2||photos.length===4)?'photo-layout-2x2':'photo-layout-3x3');const photosHtml=photos.map(p=>`<span class="photo-thumb"><img src="${p}" class="zoomable"></span>`).join('');const videosHtml=(e.videos||[]).map(bvid=>`<div class="video-cell"><iframe src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=0" allowfullscreen></iframe></div>`).join('');container.innerHTML+=`<div class="entry"><div class="entry-meta"><span class="dot">•</span>${e.date}${e.location?'<br><span class="entry-location">📍 '+e.location+'</span>':''}</div><div class="middle-col"><div class="photo-grid ${photoLayout}">${photosHtml}${videosHtml}</div></div><div class="right-col"><div class="entry-note">${e.note||''}</div></div></div>`;});setupEntryReveal();setupTouchWindLift();document.querySelectorAll('.zoomable').forEach(img=>{img.addEventListener('click',function(ev){ev.stopPropagation();openLightbox(this.src);});});}
    revealTitle();loadEntries();function closeLightbox(){document.getElementById('lightbox').classList.remove('is-open');}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
  </script>
  <script data-goatcounter="https://kiara-mytrace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script src="/search.js"></script>
</body>
</html>
