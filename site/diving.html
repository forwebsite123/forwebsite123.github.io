<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diving</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fcfbf8;
      color: #6e4a4a;
      font-family: "Times New Roman", Georgia, serif;
      overflow-x: hidden;
    }

    .dive-bubbles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .dive-bubbles span {
      position: absolute;
      left: var(--bubble-left);
      bottom: -18vh;
      width: var(--bubble-size);
      aspect-ratio: 1;
      border: 1px solid rgba(218, 250, 255, 0.10);
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.76) 0 8%, transparent 18%),
        radial-gradient(circle at 72% 72%, rgba(255, 180, 222, 0.24) 0 14%, transparent 34%),
        radial-gradient(circle at 25% 78%, rgba(123, 211, 252, 0.23) 0 16%, transparent 42%),
        conic-gradient(from 28deg, rgba(112, 204, 255, 0.26), rgba(255, 196, 234, 0.27), rgba(255, 240, 142, 0.20), rgba(145, 246, 229, 0.22), rgba(112, 204, 255, 0.26));
      box-shadow:
        inset -10px -12px 24px rgba(56, 126, 168, 0.17),
        inset 8px 8px 22px rgba(255, 255, 255, 0.40),
        0 0 26px rgba(112, 199, 235, 0.22);
      transform: translate3d(0, 0, 0) scale(0.34);
      animation: diveBubbleRise var(--bubble-duration) linear infinite;
      animation-delay: var(--bubble-delay);
      will-change: transform, opacity;
    }

    .dive-bubbles span::before {
      content: "";
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 34%),
        radial-gradient(circle at 78% 24%, rgba(255, 220, 244, 0.22) 0 10%, transparent 30%);
      opacity: 0.76;
    }

    .dive-bubbles span::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border-top: 1.5px solid rgba(255, 255, 255, 0.46);
      border-left: 1.5px solid rgba(255, 255, 255, 0.22);
      opacity: 0.70;
    }

    .dive-bubbles span:nth-child(1) { --bubble-left: 8%; --bubble-size: 52px; --bubble-duration: 30s; --bubble-delay: -6s; --bubble-drift: 38px; --bubble-wave-a: -10px; --bubble-wave-b: 16px; --bubble-wave-c: -6px; --bubble-wave-d: 24px; }
    .dive-bubbles span:nth-child(2) { --bubble-left: 23%; --bubble-size: 88px; --bubble-duration: 38s; --bubble-delay: -18s; --bubble-drift: -28px; --bubble-wave-a: 14px; --bubble-wave-b: -20px; --bubble-wave-c: 8px; --bubble-wave-d: -18px; }
    .dive-bubbles span:nth-child(3) { --bubble-left: 42%; --bubble-size: 44px; --bubble-duration: 26s; --bubble-delay: -11s; --bubble-drift: 28px; --bubble-wave-a: -12px; --bubble-wave-b: 12px; --bubble-wave-c: -8px; --bubble-wave-d: 18px; }
    .dive-bubbles span:nth-child(4) { --bubble-left: 61%; --bubble-size: 74px; --bubble-duration: 35s; --bubble-delay: -23s; --bubble-drift: -38px; --bubble-wave-a: 16px; --bubble-wave-b: -14px; --bubble-wave-c: 12px; --bubble-wave-d: -24px; }
    .dive-bubbles span:nth-child(5) { --bubble-left: 77%; --bubble-size: 60px; --bubble-duration: 31s; --bubble-delay: -14s; --bubble-drift: 26px; --bubble-wave-a: -10px; --bubble-wave-b: 16px; --bubble-wave-c: -12px; --bubble-wave-d: 18px; }
    .dive-bubbles span:nth-child(6) { --bubble-left: 88%; --bubble-size: 104px; --bubble-duration: 43s; --bubble-delay: -30s; --bubble-drift: -32px; --bubble-wave-a: 18px; --bubble-wave-b: -22px; --bubble-wave-c: 12px; --bubble-wave-d: -20px; }

    @keyframes diveBubbleRise {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.32);
      }
      10% {
        opacity: 0.50;
      }
      25% {
        transform: translate3d(var(--bubble-wave-a), -28vh, 0) scale(0.62);
      }
      45% {
        transform: translate3d(var(--bubble-wave-b), -54vh, 0) scale(0.92);
      }
      65% {
        transform: translate3d(var(--bubble-wave-c), -80vh, 0) scale(1.16);
      }
      82% {
        opacity: 0.32;
        transform: translate3d(var(--bubble-wave-d), -102vh, 0) scale(1.34);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--bubble-drift), -122vh, 0) scale(1.50);
      }
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 28px 90px;
      position: relative;
      z-index: 1;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 36px;
    }

    .site-note {
      font-size: 16px;
      color: rgba(122, 87, 87, 0.78);
      font-style: italic;
      letter-spacing: 0.3px;
    }

    .search-btn {
      text-decoration: none;
      color: #8a6666;
      font-size: 28px;
      line-height: 1;
    }

    .title-wrap { margin-bottom: 30px; }

    .page-title {
      margin: 0;
      font-size: 56px;
      font-style: italic;
      font-weight: 500;
      color: #8b5e5e;
      line-height: 1.05;
    }

    .back-link {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: rgba(122, 87, 87, 0.75);
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 22px;
      align-items: start;
    }

    .timeline-side {
      position: sticky;
      top: 30px;
      height: 100%;
      min-height: 500px;
      display: flex;
      justify-content: center;
    }

    .timeline-line {
      position: relative;
      width: 1px;
      background: rgba(122, 87, 87, 0.35);
      min-height: 700px;
    }

    .timeline-top,
    .timeline-bottom {
      position: absolute;
      left: -22px;
      font-size: 16px;
      color: rgba(122, 87, 87, 0.78);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 2px;
    }

    .timeline-top { top: 0; }
    .timeline-bottom { bottom: 0; }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 72px;
    }

    .entry {
      scroll-margin-top: 24px;
      display: grid;
      grid-template-columns: 280px auto 220px;
      gap: 38px;
      align-items: start;
      opacity: 0.32;
      filter: blur(4px);
      transform: translateY(10px);
      transition: opacity 0.9s ease-out, filter 0.9s ease-out, transform 0.9s ease-out;
    }

    .entry.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }

    .left-col,
    .middle-col { min-width: 0; }

    .entry-meta {
      font-size: 30px;
      color: #9a6666;
      margin-bottom: 18px;
      line-height: 1.2;
    }

    .entry-meta .dot {
      font-size: 36px;
      vertical-align: middle;
      margin-right: 10px;
    }

    .record-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
      max-width: 280px;
    }

    .record-card {
      width: 118px;
      aspect-ratio: 3 / 4;
      display: block;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(122, 87, 87, 0.18);
      background: white;
      box-shadow: 0 8px 24px rgba(122, 87, 87, 0.06);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      flex: 0 0 auto;
    }

    .record-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px rgba(122, 87, 87, 0.12);
    }

    .record-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .record-caption {
      margin-top: 12px;
      font-size: 15px;
      color: rgba(122, 87, 87, 0.7);
      line-height: 1.7;
      max-width: 250px;
    }

    .photo-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .photo-grid.photo-layout-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 170px);
      width: max-content;
    }

    .photo-grid.photo-layout-single {
      display: block;
      max-width: 360px;
    }

    .photo-thumb {
      width: 170px;
      height: 170px;
      display: block;
      position: relative;
      overflow: hidden;
      background: white;
      cursor: pointer;
      flex: 0 0 auto;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-grid.photo-layout-single .photo-thumb {
      width: 360px;
      height: 360px;
      max-width: 100%;
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .photo-thumb:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(122, 87, 87, 0.12);
    }

    .record-card::before,
    .record-card::after,
    .photo-thumb::before,
    .photo-thumb::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62%;
      aspect-ratio: 1;
      border: 2px solid rgba(175, 225, 238, 0.55);
      border-radius: 48% 52% 51% 49% / 52% 48% 50% 50%;
      opacity: 0;
      background:
        radial-gradient(circle, rgba(214, 244, 250, 0.13) 0 16%, transparent 48%),
        radial-gradient(circle, transparent 52%, rgba(210, 244, 250, 0.18) 58%, transparent 66%);
      box-shadow:
        0 0 14px rgba(140, 215, 235, 0.26),
        inset 0 0 18px rgba(235, 255, 255, 0.18);
      transform: translate(-50%, -50%) scale(0.24) rotate(0deg);
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 2;
    }

    .record-card::after,
    .photo-thumb::after {
      width: 48%;
      border-color: rgba(218, 248, 255, 0.46);
      box-shadow:
        0 0 20px rgba(170, 230, 244, 0.26),
        inset 0 0 14px rgba(255, 255, 255, 0.20);
    }

    @keyframes thumbnailWaterRipple {
      0% {
        opacity: 0.56;
        transform: translate(-50%, -50%) scale(0.24) rotate(0deg);
      }
      42% {
        opacity: 0.34;
      }
      72% {
        opacity: 0.16;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.55) rotate(5deg);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .record-card:hover::before,
      .record-card:hover::after,
      .photo-thumb:hover::before,
      .photo-thumb:hover::after {
        animation: thumbnailWaterRipple 2.85s cubic-bezier(0.16, 0.72, 0.22, 1) infinite;
      }

      .record-card:hover::after,
      .photo-thumb:hover::after {
        animation-delay: 0.82s;
      }
    }

    .record-card.is-rippling::before,
    .record-card.is-rippling::after,
    .photo-thumb.is-rippling::before,
    .photo-thumb.is-rippling::after {
      animation: thumbnailWaterRipple 1.85s cubic-bezier(0.16, 0.72, 0.22, 1) 1;
    }

    .record-card.is-rippling::after,
    .photo-thumb.is-rippling::after {
      animation-delay: 0.32s;
    }

    .video-cell {
      width: 170px;
      height: 170px;
      position: relative;
      flex-shrink: 0;
    }

    .video-cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .right-col { padding-top: 52px; }

    .entry-note {
      font-size: 15px;
      line-height: 1.95;
      color: rgba(122, 87, 87, 0.75);
      max-width: 220px;
      padding: 4px 0 4px 22px;
      border-left: 1px solid rgba(122, 87, 87, 0.22);
    }

    .page-footer {
      text-align: center;
      margin-top: 100px;
      position: relative;
      z-index: 1;
      top: -24px;
      font-size: 14px;
      font-style: italic;
      letter-spacing: 1px;
      color: rgba(122, 87, 87, 0.7);
    }

    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 26px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #lightbox.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      background: white;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      filter: blur(10px);
      transform: scale(0.97);
      transition: filter 0.5s ease-out, transform 0.5s ease-out;
    }

    #lightbox.is-open img {
      filter: blur(0);
      transform: scale(1);
    }

    .close-tip {
      position: absolute;
      top: 24px;
      right: 28px;
      color: rgba(255,255,255,0.84);
      font-size: 14px;
      letter-spacing: 1px;
    }

    @keyframes pageTextReveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title-wrap {
      animation: pageTextReveal 0.55s ease both;
    }

    .entry-meta,
    .entry-note {
      animation: pageTextReveal 0.42s ease both;
    }

    @media (prefers-reduced-motion: reduce) {
      .dive-bubbles span,
      .title-wrap,
      .entry,
      .entry-meta,
      .entry-note {
        opacity: 1;
        filter: none;
        transform: none;
        animation: none;
        transition: none;
      }

      #lightbox,
      #lightbox img {
        transition: none;
      }

      #lightbox img {
        filter: none;
        transform: none;
      }

      .record-card:hover::before,
      .record-card:hover::after,
      .record-card.is-rippling::before,
      .record-card.is-rippling::after,
      .photo-thumb:hover::before,
      .photo-thumb:hover::after,
      .photo-thumb.is-rippling::before,
      .photo-thumb.is-rippling::after {
        display: none;
        animation: none;
      }
    }

    @media (max-width: 1100px) {
      .entry {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .right-col { padding-top: 0; }

      .entry-note {
        max-width: none;
        padding-left: 18px;
      }
    }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .timeline-side { display: none; }
      .page-title { font-size: 42px; }
      .entry-meta { font-size: 24px; }

      .dive-bubbles { opacity: 0.72; }
      .dive-bubbles span:nth-child(n+4) { display: none; }

      .photo-thumb {
        width: calc(33.333% - 14px);
        min-width: 96px;
        height: 120px;
      }

      .photo-grid.photo-layout-2x2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .photo-grid.photo-layout-2x2 .photo-thumb {
        width: 100%;
        min-width: 0;
      }

      .photo-grid.photo-layout-single {
        max-width: none;
      }

      .photo-grid.photo-layout-single .photo-thumb {
        width: 100%;
        height: min(72vw, 360px);
      }

      .record-grid {
        gap: 12px;
        max-width: none;
      }

      .record-card { width: 96px; }
    }
  </style>
</head>
<body>
  <div class="dive-bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <div class="page">
    <div class="topline">
      <div class="site-note">A place to leave traces.</div>
      <a href="#" class="search-btn" aria-label="Search" id="search-icon">⌕</a>
    </div>

    <div class="title-wrap">
      <h1 class="page-title">Diving</h1>
      <a href="into-the-wild.html" class="back-link">← Back</a>
    </div>

    <div class="layout">
      <div class="timeline-side">
        <div class="timeline-line">
          <div class="timeline-top">NEW</div>
          <div class="timeline-bottom">OLD</div>
        </div>
      </div>

      <div class="entries" id="entries"></div>
    </div>
  </div>

  <div class="page-footer">
    “此处曾有杂音，现已回归深蓝。”
  </div>

  <div id="lightbox" onclick="closeLightbox()">
    <div class="close-tip">tap anywhere to close</div>
    <img id="lightbox-img" src="" alt="large preview">
  </div>

  <script>
    function parseEntryDate(value) {
      if (!value) return null;
      const parts = String(value).trim().split(/\s*-\s*/);
      const start = parseDatePart(parts[0]);
      if (!start) return null;
      return parts.length > 1 ? (parseDatePart(parts[parts.length - 1], start) || start) : start;
    }

    function parseDatePart(value, base) {
      const normalized = String(value || '').trim().replace(/\//g, '.');
      const full = normalized.match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})$/);
      if (full) return new Date(Date.UTC(Number(full[1]), Number(full[2]) - 1, Number(full[3])));
      const partial = normalized.match(/^(\d{1,2})\.(\d{1,2})$/);
      if (partial && base) return new Date(Date.UTC(base.getUTCFullYear(), Number(partial[1]) - 1, Number(partial[2])));
      return null;
    }

    function entryAnchor(entry) {
      const date = parseEntryDate(entry.date);
      if (!date || Number.isNaN(date.getTime())) return '';
      const day = date.toISOString().slice(0, 10);
      const slug = String(entry.location || '')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 36);
      return slug ? `entry-${day}-${slug}` : `entry-${day}`;
    }

    function setupEntryReveal() {
      const entries = document.querySelectorAll('.entry');
      if (!entries.length) return;

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
        entries.forEach(entry => entry.classList.add('is-visible'));
        return;
      }

      const observer = new IntersectionObserver(items => {
        items.forEach(item => {
          if (item.isIntersecting) {
            item.target.classList.add('is-visible');
            observer.unobserve(item.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });

      entries.forEach(entry => observer.observe(entry));
    }

    function setupTouchRipple() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (!window.matchMedia('(hover: none), (pointer: coarse)').matches) return;

      document.querySelectorAll('.photo-thumb, .record-card').forEach(target => {
        target.addEventListener('pointerdown', () => {
          target.classList.remove('is-rippling');
          void target.offsetWidth;
          target.classList.add('is-rippling');
          clearTimeout(target._rippleTimer);
          target._rippleTimer = setTimeout(() => target.classList.remove('is-rippling'), 2300);
        }, { passive: true });
      });
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      lbImg.src = src;
      lb.classList.remove('is-open');
      requestAnimationFrame(() => lb.classList.add('is-open'));
    }

    async function loadEntries() {
      const res = await fetch('/diving.json');
      const data = await res.json();
      data.entries.sort((a, b) => {
        const da = (a.date || '').replace(/\./g, '');
        const db = (b.date || '').replace(/\./g, '');
        return db.localeCompare(da);
      });
      const container = document.getElementById('entries');
      data.entries.forEach(e => {
        const photos = e.photos || [];
        const photoLayout = photos.length === 1 ? 'photo-layout-single' : ((photos.length === 2 || photos.length === 4) ? 'photo-layout-2x2' : 'photo-layout-3x3');
        const photosHtml = photos.map(p => `<span class="photo-thumb"><img src="${p}" class="zoomable"></span>`).join('');
        const videosHtml = (e.videos || []).map(bvid => `<div class="video-cell"><iframe src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=0" allowfullscreen></iframe></div>`).join('');
        const recordImgs = e.record_image ? (Array.isArray(e.record_image) ? e.record_image : [e.record_image]) : [];
        const recordHtml = recordImgs.length ? `<div class="record-grid">${recordImgs.map(ri => `<div class="record-card"><img src="${ri}" class="zoomable"></div>`).join('')}</div><div class="record-caption">${e.record_caption || ''}</div>` : '';
        const id = entryAnchor(e);
        container.innerHTML += `<div class="entry"${id ? ` id="${id}"` : ''}><div class="left-col"><div class="entry-meta"><span class="dot">•</span>${e.date}${e.location ? '<br><span class="entry-location">📍 ' + e.location + '</span>' : ''}</div>${recordHtml}</div><div class="middle-col"><div class="photo-grid ${photoLayout}">${photosHtml}${videosHtml}</div></div><div class="right-col"><div class="entry-note">${e.note || ""}</div></div></div>`;
      });

      setupEntryReveal();
      setupTouchRipple();

      document.querySelectorAll('.zoomable').forEach(img => {
        img.addEventListener('click', function(ev) {
          ev.stopPropagation();
          openLightbox(this.src);
        });
      });
    }
    loadEntries();
    function closeLightbox() { document.getElementById('lightbox').classList.remove('is-open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
