<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowboarding</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fcfbf8; color: #6e4a4a; font-family: "Times New Roman", Georgia, serif; overflow-x: hidden; }

    .snow-flakes { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .snow-flakes span { position: absolute; left: var(--snow-left); top: -14vh; width: var(--snow-size); aspect-ratio: 1; opacity: 0; background: center / contain no-repeat url("/images/snowboarding/snow-crystal-bg.svg"); filter: drop-shadow(0 0 2px rgba(255,255,255,.56)) drop-shadow(0 0 7px rgba(255,244,188,.16)); transform: translate3d(0,0,0) rotate(0deg) scale(.72); animation: snowCrystalFall var(--snow-duration) linear infinite; animation-delay: var(--snow-delay); will-change: transform, opacity; }
    .snow-flakes span::before, .snow-flakes span::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
    .snow-flakes span::before { background: radial-gradient(circle at 33% 30%, rgba(255,255,255,.38) 0%, rgba(255,246,198,.12) 22%, rgba(255,236,150,.035) 42%, transparent 68%); filter: blur(1.2px); opacity: .54; transform: scale(1.06); }
    .snow-flakes span::after { background: radial-gradient(circle, rgba(255,255,255,.07) 0%, rgba(255,244,188,.045) 42%, transparent 74%); filter: blur(5px); opacity: .24; transform: scale(1.36); }
    .snow-flakes span:nth-child(1) { --snow-left: 8%; --snow-size: 28px; --snow-duration: 42s; --snow-delay: -8s; --snow-drift: 34px; --snow-wave-a: -10px; --snow-wave-b: 18px; --snow-wave-c: -8px; --snow-spin: 115deg; }
    .snow-flakes span:nth-child(2) { --snow-left: 18%; --snow-size: 21px; --snow-duration: 36s; --snow-delay: -18s; --snow-drift: -24px; --snow-wave-a: 14px; --snow-wave-b: -16px; --snow-wave-c: 8px; --snow-spin: -90deg; }
    .snow-flakes span:nth-child(3) { --snow-left: 30%; --snow-size: 40px; --snow-duration: 50s; --snow-delay: -28s; --snow-drift: 42px; --snow-wave-a: -16px; --snow-wave-b: 20px; --snow-wave-c: -12px; --snow-spin: 140deg; }
    .snow-flakes span:nth-child(4) { --snow-left: 43%; --snow-size: 25px; --snow-duration: 39s; --snow-delay: -13s; --snow-drift: -30px; --snow-wave-a: 12px; --snow-wave-b: -20px; --snow-wave-c: 10px; --snow-spin: -120deg; }
    .snow-flakes span:nth-child(5) { --snow-left: 55%; --snow-size: 34px; --snow-duration: 46s; --snow-delay: -34s; --snow-drift: 28px; --snow-wave-a: -12px; --snow-wave-b: 16px; --snow-wave-c: -10px; --snow-spin: 100deg; }
    .snow-flakes span:nth-child(6) { --snow-left: 66%; --snow-size: 20px; --snow-duration: 33s; --snow-delay: -6s; --snow-drift: -22px; --snow-wave-a: 10px; --snow-wave-b: -14px; --snow-wave-c: 8px; --snow-spin: -80deg; }
    .snow-flakes span:nth-child(7) { --snow-left: 76%; --snow-size: 46px; --snow-duration: 54s; --snow-delay: -24s; --snow-drift: 36px; --snow-wave-a: -18px; --snow-wave-b: 22px; --snow-wave-c: -12px; --snow-spin: 150deg; }
    .snow-flakes span:nth-child(8) { --snow-left: 86%; --snow-size: 29px; --snow-duration: 41s; --snow-delay: -16s; --snow-drift: -32px; --snow-wave-a: 12px; --snow-wave-b: -18px; --snow-wave-c: 10px; --snow-spin: -110deg; }
    .snow-flakes span:nth-child(9) { --snow-left: 94%; --snow-size: 23px; --snow-duration: 37s; --snow-delay: -30s; --snow-drift: -26px; --snow-wave-a: 8px; --snow-wave-b: -16px; --snow-wave-c: 8px; --snow-spin: 85deg; }
    .snow-flakes span:nth-child(10) { --snow-left: 3%; --snow-size: 38px; --snow-duration: 48s; --snow-delay: -39s; --snow-drift: 30px; --snow-wave-a: -14px; --snow-wave-b: 18px; --snow-wave-c: -10px; --snow-spin: -130deg; }
    @keyframes snowCrystalFall { 0% { opacity: 0; transform: translate3d(0,-12vh,0) rotate(0deg) scale(.68); } 12% { opacity: .88; } 30% { transform: translate3d(var(--snow-wave-a),28vh,0) rotate(calc(var(--snow-spin) * .30)) scale(.86); } 54% { transform: translate3d(var(--snow-wave-b),56vh,0) rotate(calc(var(--snow-spin) * .54)) scale(1); } 78% { opacity: .66; transform: translate3d(var(--snow-wave-c),88vh,0) rotate(calc(var(--snow-spin) * .78)) scale(1.05); } 100% { opacity: 0; transform: translate3d(var(--snow-drift),118vh,0) rotate(var(--snow-spin)) scale(1.12); } }

    .page { max-width: 1280px; margin: 0 auto; padding: 28px 28px 90px; position: relative; z-index: 2; }
    .topline { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 36px; }
    .site-note { font-size: 16px; color: rgba(122,87,87,.78); font-style: italic; letter-spacing: .3px; }
    .search-btn { text-decoration: none; color: #8a6666; font-size: 28px; line-height: 1; }
    .title-wrap { margin-bottom: 30px; }
    .page-title { margin: 0; font-size: 56px; font-style: italic; font-weight: 500; color: #8b5e5e; line-height: 1.05; }
    .back-link { display: inline-block; margin-top: 10px; text-decoration: none; color: rgba(122,87,87,.75); font-size: 15px; }
    .layout { display: grid; grid-template-columns: 72px 1fr; gap: 22px; align-items: start; }
    .timeline-side { position: sticky; top: 30px; height: 100%; min-height: 500px; display: flex; justify-content: center; }
    .timeline-line { position: relative; width: 1px; background: rgba(122,87,87,.35); min-height: 700px; }
    .timeline-top, .timeline-bottom { position: absolute; left: -22px; font-size: 16px; color: rgba(122,87,87,.78); writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; }
    .timeline-top { top: 0; }
    .timeline-bottom { bottom: 0; }
    .entries { display: flex; flex-direction: column; gap: 72px; }
    .entry { scroll-margin-top: 24px; display: grid; grid-template-columns: 280px auto 220px; gap: 38px; align-items: start; opacity: .32; filter: blur(4px); transform: translateY(10px); transition: opacity .9s ease-out, filter .9s ease-out, transform .9s ease-out; }
    .entry.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
    .left-col, .middle-col { min-width: 0; }
    .entry-meta { font-size: 30px; color: #9a6666; margin-bottom: 18px; line-height: 1.2; }
    .entry-meta .dot { font-size: 36px; vertical-align: middle; margin-right: 10px; }
    .record-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; max-width: 280px; }
    .record-card { width: 118px; aspect-ratio: 3 / 4; display: block; overflow: hidden; position: relative; border: 1px solid rgba(122,87,87,.18); background: white; box-shadow: 0 8px 24px rgba(122,87,87,.06); cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; flex: 0 0 auto; }
    .record-card:hover { transform: translateY(-3px); box-shadow: 0 16px 30px rgba(122,87,87,.12); }
    .record-card img, .photo-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
    .record-caption { margin-top: 12px; font-size: 15px; color: rgba(122,87,87,.7); line-height: 1.7; max-width: 250px; }
    .photo-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
    .photo-grid.photo-layout-2x2 { display: grid; grid-template-columns: repeat(2, 170px); width: max-content; }
    .photo-grid.photo-layout-single { display: block; max-width: 360px; }
    .photo-thumb { width: 170px; height: 170px; display: block; position: relative; overflow: hidden; background: white; cursor: pointer; flex: 0 0 auto; transition: transform .2s ease, box-shadow .2s ease; }
    .photo-grid.photo-layout-single .photo-thumb { width: 360px; height: 360px; max-width: 100%; }
    .photo-thumb:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(122,87,87,.12); }
    .record-card::before, .record-card::after, .photo-thumb::before, .photo-thumb::after { content: ""; position: absolute; left: 50%; top: 50%; width: 70%; aspect-ratio: 1; opacity: 0; pointer-events: none; z-index: 2; background: center / contain no-repeat url("/images/snowboarding/snow-crystal-hover.svg"); filter: drop-shadow(0 0 8px rgba(255,255,255,.62)) drop-shadow(0 0 14px rgba(218,246,255,.34)); transform: translate(-50%,-50%) scale(.22) rotate(0deg); }
    .record-card::after, .photo-thumb::after { width: 52%; opacity: 0; filter: drop-shadow(0 0 16px rgba(239,252,255,.30)); }
    @keyframes thumbnailSnowCrystal { 0% { opacity: .72; transform: translate(-50%,-50%) scale(.22) rotate(0deg); } 38% { opacity: .42; } 72% { opacity: .18; } 100% { opacity: 0; filter: drop-shadow(0 0 18px rgba(218,246,255,.14)) blur(1px); transform: translate(-50%,-50%) scale(2.25) rotate(28deg); } }
    @media (hover: hover) and (pointer: fine) { .record-card:hover::before, .record-card:hover::after, .photo-thumb:hover::before, .photo-thumb:hover::after { animation: thumbnailSnowCrystal 2.65s cubic-bezier(.16,.72,.22,1) infinite; } .record-card:hover::after, .photo-thumb:hover::after { animation-delay: .50s; } }
    .record-card.is-snowing::before, .record-card.is-snowing::after, .photo-thumb.is-snowing::before, .photo-thumb.is-snowing::after { animation: thumbnailSnowCrystal 1.9s cubic-bezier(.16,.72,.22,1) 1; }
    .record-card.is-snowing::after, .photo-thumb.is-snowing::after { animation-delay: .28s; }
    .video-cell { width: 170px; height: 170px; position: relative; flex-shrink: 0; }
    .video-cell iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .right-col { padding-top: 52px; }
    .entry-note { font-size: 15px; line-height: 1.95; color: rgba(122,87,87,.75); max-width: 220px; padding: 4px 0 4px 22px; border-left: 1px solid rgba(122,87,87,.22); }
    .page-footer { text-align: center; margin-top: 100px; position: relative; z-index: 2; top: -24px; font-size: 14px; font-style: italic; letter-spacing: 1px; color: rgba(122,87,87,.7); }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 26px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s ease, visibility .4s ease; }
    #lightbox.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    #lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; background: white; box-shadow: 0 20px 60px rgba(0,0,0,.4); filter: blur(10px); transform: scale(.97); transition: filter .5s ease-out, transform .5s ease-out; }
    #lightbox.is-open img { filter: blur(0); transform: scale(1); }
    .close-tip { position: absolute; top: 24px; right: 28px; color: rgba(255,255,255,.84); font-size: 14px; letter-spacing: 1px; }

    @media (prefers-reduced-motion: reduce) { .snow-flakes span, .entry { opacity: 1; filter: none; transform: none; animation: none; transition: none; } #lightbox, #lightbox img { transition: none; } #lightbox img { filter: none; transform: none; } .record-card:hover::before, .record-card:hover::after, .record-card.is-snowing::before, .record-card.is-snowing::after, .photo-thumb:hover::before, .photo-thumb:hover::after, .photo-thumb.is-snowing::before, .photo-thumb.is-snowing::after { display: none; animation: none; } }
    @media (max-width: 1100px) { .entry { grid-template-columns: 1fr; gap: 24px; } .right-col { padding-top: 0; } .entry-note { max-width: none; padding-left: 18px; } }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .timeline-side { display: none; } .page-title { font-size: 42px; } .entry-meta { font-size: 24px; } .snow-flakes { opacity: .95; } .snow-flakes span:nth-child(n+6) { display: none; } .photo-thumb { width: calc(33.333% - 14px); min-width: 96px; height: 120px; } .photo-grid.photo-layout-2x2 { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; } .photo-grid.photo-layout-2x2 .photo-thumb { width: 100%; min-width: 0; } .photo-grid.photo-layout-single { max-width: none; } .photo-grid.photo-layout-single .photo-thumb { width: 100%; height: min(72vw, 360px); } .record-grid { gap: 12px; max-width: none; } .record-card { width: 96px; } }
  </style>
</head>
<body>
  <div class="snow-flakes" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="page">
    <div class="topline"><div class="site-note">A place to leave traces.</div><a href="#" class="search-btn" aria-label="Search" id="search-icon">⌕</a></div>
    <div class="title-wrap"><h1 class="page-title">Snowboarding</h1><a href="into-the-wild.html" class="back-link">← Back</a></div>
    <div class="layout"><div class="timeline-side"><div class="timeline-line"><div class="timeline-top">NEW</div><div class="timeline-bottom">OLD</div></div></div><div class="entries" id="entries"></div></div>
  </div>
  <div class="page-footer">"Carve your own path and let the snow tell your story."</div>
  <div id="lightbox" onclick="closeLightbox()"><div class="close-tip">tap anywhere to close</div><img id="lightbox-img" src="" alt="large preview"></div>
  <script>
    function parseEntryDate(value){if(!value)return null;const parts=String(value).trim().split(/\s*-\s*/);const start=parseDatePart(parts[0]);if(!start)return null;return parts.length>1?(parseDatePart(parts[parts.length-1],start)||start):start;}
    function parseDatePart(value,base){const normalized=String(value||'').trim().replace(/\//g,'.');const full=normalized.match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})$/);if(full)return new Date(Date.UTC(Number(full[1]),Number(full[2])-1,Number(full[3])));const partial=normalized.match(/^(\d{1,2})\.(\d{1,2})$/);if(partial&&base)return new Date(Date.UTC(base.getUTCFullYear(),Number(partial[1])-1,Number(partial[2])));return null;}
    function entryAnchor(entry){const date=parseEntryDate(entry.date);if(!date||Number.isNaN(date.getTime()))return '';const day=date.toISOString().slice(0,10);const slug=String(entry.location||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,36);return slug?`entry-${day}-${slug}`:`entry-${day}`;}
    function setupEntryReveal(){const entries=document.querySelectorAll('.entry');if(!entries.length)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver'in window)){entries.forEach(entry=>entry.classList.add('is-visible'));return;}const observer=new IntersectionObserver(items=>{items.forEach(item=>{if(item.isIntersecting){item.target.classList.add('is-visible');observer.unobserve(item.target);}});},{threshold:.15,rootMargin:'0px 0px -6% 0px'});entries.forEach(entry=>observer.observe(entry));}
    function setupTouchSnowCrystal(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(!window.matchMedia('(hover: none), (pointer: coarse)').matches)return;document.querySelectorAll('.photo-thumb, .record-card').forEach(target=>{target.addEventListener('pointerdown',()=>{target.classList.remove('is-snowing');void target.offsetWidth;target.classList.add('is-snowing');clearTimeout(target._snowTimer);target._snowTimer=setTimeout(()=>target.classList.remove('is-snowing'),2200);},{passive:true});});}
    function openLightbox(src){const lb=document.getElementById('lightbox');const lbImg=document.getElementById('lightbox-img');lbImg.src=src;lb.classList.remove('is-open');requestAnimationFrame(()=>lb.classList.add('is-open'));}
    async function loadEntries(){const res=await fetch('/snowboarding.json');const data=await res.json();data.entries.sort((a,b)=>{const da=(a.date||'').replace(/\./g,'');const db=(b.date||'').replace(/\./g,'');return db.localeCompare(da);});const container=document.getElementById('entries');data.entries.forEach(e=>{const photos=e.photos||[];const photoLayout=photos.length===1?'photo-layout-single':((photos.length===2||photos.length===4)?'photo-layout-2x2':'photo-layout-3x3');const photosHtml=photos.map(p=>`<span class="photo-thumb"><img src="${p}" class="zoomable"></span>`).join('');const videosHtml=(e.videos||[]).map(bvid=>`<div class="video-cell"><iframe src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=0" allowfullscreen></iframe></div>`).join('');const recordImgs=e.record_image?(Array.isArray(e.record_image)?e.record_image:[e.record_image]):[];const recordHtml=recordImgs.length?`<div class="record-grid">${recordImgs.map(ri=>`<div class="record-card"><img src="${ri}" alt="record" class="zoomable"></div>`).join('')}</div><div class="record-caption">${e.record_caption||''}</div>`:'';const id=entryAnchor(e);container.innerHTML+=`<div class="entry"${id?` id="${id}"`:''}><div class="left-col"><div class="entry-meta"><span class="dot">•</span>${e.date}${e.location?'<br><span class="entry-location">📍 '+e.location+'</span>':''}</div>${recordHtml}</div><div class="middle-col"><div class="photo-grid ${photoLayout}">${photosHtml}${videosHtml}</div></div><div class="right-col"><div class="entry-note">${e.note||''}</div></div></div>`;});setupEntryReveal();setupTouchSnowCrystal();document.querySelectorAll('.zoomable').forEach(img=>{img.addEventListener('click',function(ev){ev.stopPropagation();openLightbox(this.src);});});}
    loadEntries();function closeLightbox(){document.getElementById('lightbox').classList.remove('is-open');}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
  </script>
  <script data-goatcounter="https://kiara-mytrace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script src="/search.js"></script>
</body>
</html>
