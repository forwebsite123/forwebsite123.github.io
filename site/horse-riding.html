<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Riding</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fcfbf8; color: #6e4a4a; font-family: "Times New Roman", Georgia, serif; overflow-x: hidden; }

    .dust-field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .dust-field span { position: absolute; left: var(--dust-left); top: var(--dust-top); width: var(--dust-size); aspect-ratio: 1; border-radius: 999px; opacity: 0; background: radial-gradient(circle, rgba(255,238,183,.68) 0%, rgba(201,142,78,.24) 42%, transparent 72%); filter: blur(.2px); transform: translate3d(0,0,0) scale(.72); animation: stableDustDrift var(--dust-duration) ease-in-out infinite; animation-delay: var(--dust-delay); will-change: transform, opacity; }
    .dust-field span:nth-child(1) { --dust-left: 5%; --dust-top: 82%; --dust-size: 7px; --dust-duration: 28s; --dust-delay: -6s; --dust-x: 130px; --dust-y: -48px; }
    .dust-field span:nth-child(2) { --dust-left: 16%; --dust-top: 72%; --dust-size: 4px; --dust-duration: 24s; --dust-delay: -14s; --dust-x: 98px; --dust-y: -34px; }
    .dust-field span:nth-child(3) { --dust-left: 27%; --dust-top: 88%; --dust-size: 9px; --dust-duration: 34s; --dust-delay: -20s; --dust-x: 160px; --dust-y: -62px; }
    .dust-field span:nth-child(4) { --dust-left: 41%; --dust-top: 78%; --dust-size: 5px; --dust-duration: 26s; --dust-delay: -9s; --dust-x: 118px; --dust-y: -45px; }
    .dust-field span:nth-child(5) { --dust-left: 54%; --dust-top: 86%; --dust-size: 8px; --dust-duration: 31s; --dust-delay: -23s; --dust-x: 145px; --dust-y: -58px; }
    .dust-field span:nth-child(6) { --dust-left: 67%; --dust-top: 76%; --dust-size: 4px; --dust-duration: 22s; --dust-delay: -4s; --dust-x: 88px; --dust-y: -32px; }
    .dust-field span:nth-child(7) { --dust-left: 78%; --dust-top: 90%; --dust-size: 10px; --dust-duration: 36s; --dust-delay: -17s; --dust-x: 165px; --dust-y: -68px; }
    .dust-field span:nth-child(8) { --dust-left: 88%; --dust-top: 70%; --dust-size: 5px; --dust-duration: 25s; --dust-delay: -12s; --dust-x: 105px; --dust-y: -36px; }
    .dust-field span:nth-child(9) { --dust-left: 35%; --dust-top: 66%; --dust-size: 3px; --dust-duration: 20s; --dust-delay: -2s; --dust-x: 76px; --dust-y: -24px; }
    .dust-field span:nth-child(10) { --dust-left: 92%; --dust-top: 84%; --dust-size: 6px; --dust-duration: 29s; --dust-delay: -26s; --dust-x: 122px; --dust-y: -52px; }
    @keyframes stableDustDrift { 0% { opacity: 0; transform: translate3d(0,0,0) scale(.64); } 18% { opacity: .46; } 48% { opacity: .38; transform: translate3d(calc(var(--dust-x) * .52), calc(var(--dust-y) * .52), 0) scale(1); } 82% { opacity: .22; } 100% { opacity: 0; transform: translate3d(var(--dust-x), var(--dust-y), 0) scale(1.18); } }

    .page { max-width: 1280px; margin: 0 auto; padding: 28px 28px 90px; position: relative; z-index: 1; }
    .topline { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 36px; }
    .site-note { font-size: 16px; color: rgba(122,87,87,.78); font-style: italic; letter-spacing: .3px; }
    .search-btn { text-decoration: none; color: #8a6666; font-size: 28px; line-height: 1; }
    .title-wrap { margin-bottom: 30px; opacity: 0; filter: blur(6px); transform: translateY(12px); transition: opacity .95s ease-out, filter .95s ease-out, transform .95s ease-out; }
    .title-wrap.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
    .page-title { margin: 0; font-size: 56px; font-style: italic; font-weight: 500; color: #8b5e5e; line-height: 1.05; }
    .back-link { display: inline-block; margin-top: 10px; text-decoration: none; color: rgba(122,87,87,.75); font-size: 15px; }
    .layout { display: grid; grid-template-columns: 72px 1fr; gap: 22px; align-items: start; }
    .timeline-side { position: sticky; top: 30px; height: 100%; min-height: 500px; display: flex; justify-content: center; }
    .timeline-line { position: relative; width: 1px; background: rgba(122,87,87,.35); min-height: 700px; }
    .timeline-top, .timeline-bottom { position: absolute; left: -22px; font-size: 16px; color: rgba(122,87,87,.78); writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; }
    .timeline-top { top: 0; }
    .timeline-bottom { bottom: 0; }
    .entries { display: flex; flex-direction: column; gap: 72px; }
    .entry { scroll-margin-top: 24px; display: grid; grid-template-columns: 280px max-content 220px; column-gap: 38px; row-gap: 0; align-items: start; opacity: .34; filter: blur(4px); transform: translateY(10px); transition: opacity .9s ease-out, filter .9s ease-out, transform .9s ease-out; }
    .entry.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
    .entry-meta { font-size: 30px; color: #9a6666; margin-bottom: 18px; line-height: 1.2; }
    .entry-meta .dot { font-size: 36px; vertical-align: middle; margin-right: 10px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 170px); gap: 20px; margin-top: 10px; align-items: start; }
    .photo-grid.photo-layout-single { grid-template-columns: 360px; }
    .photo-grid.photo-layout-2x2 { grid-template-columns: repeat(2, 170px); }
    .photo-thumb { width: 170px; height: 170px; display: block; position: relative; overflow: hidden; background: white; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
    .photo-grid.photo-layout-single .photo-thumb { width: 360px; height: 360px; }
    .photo-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
    .photo-thumb:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(122,87,87,.12); }
    .photo-thumb::before, .photo-thumb::after { content: ""; position: absolute; left: 50%; top: 50%; width: 72%; aspect-ratio: 1; opacity: 0; pointer-events: none; z-index: 2; background: center / contain no-repeat url("/images/horse-riding/horse-head-silhouette.svg"); filter: drop-shadow(0 0 9px rgba(255,239,188,.34)); transform: translate(-50%,-50%) scale(.20) rotate(-3deg); }
    .photo-thumb::after { width: 54%; filter: drop-shadow(0 0 14px rgba(255,244,196,.24)); }
    @keyframes horseSealExpand { 0% { opacity: .62; transform: translate(-50%,-50%) scale(.20) rotate(-3deg); } 40% { opacity: .38; } 76% { opacity: .16; } 100% { opacity: 0; filter: drop-shadow(0 0 16px rgba(255,239,188,.10)) blur(.8px); transform: translate(-50%,-50%) scale(2.05) rotate(8deg); } }
    @media (hover: hover) and (pointer: fine) { .photo-thumb:hover::before, .photo-thumb:hover::after { animation: horseSealExpand 2.8s cubic-bezier(.16,.72,.22,1) infinite; } .photo-thumb:hover::after { animation-delay: .55s; } }
    .photo-thumb.is-stamped::before, .photo-thumb.is-stamped::after { animation: horseSealExpand 1.9s cubic-bezier(.16,.72,.22,1) 1; }
    .photo-thumb.is-stamped::after { animation-delay: .26s; }
    .video-cell { width: 170px; height: 170px; position: relative; flex-shrink: 0; }
    .video-cell iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .right-col { padding-top: 52px; margin-left: 48px; }
    .entry-note { font-size: 15px; line-height: 1.95; color: rgba(122,87,87,.75); max-width: 220px; padding: 4px 0 4px 22px; border-left: 1px solid rgba(122,87,87,.22); }
    .page-footer { text-align: center; margin-top: 100px; position: relative; z-index: 1; top: -24px; font-size: 14px; font-style: italic; letter-spacing: 1px; color: rgba(122,87,87,.7); }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 26px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s ease, visibility .4s ease; }
    #lightbox.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    #lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; background: white; box-shadow: 0 20px 60px rgba(0,0,0,.4); filter: blur(10px); transform: scale(.97); transition: filter .5s ease-out, transform .5s ease-out; }
    #lightbox.is-open img { filter: blur(0); transform: scale(1); }
    .close-tip { position: absolute; top: 24px; right: 28px; color: rgba(255,255,255,.84); font-size: 14px; letter-spacing: 1px; }
    @media (prefers-reduced-motion: reduce) { .dust-field span, .title-wrap, .entry { opacity: 1; filter: none; transform: none; animation: none; transition: none; } #lightbox, #lightbox img { transition: none; } #lightbox img { filter: none; transform: none; } .photo-thumb:hover::before, .photo-thumb:hover::after, .photo-thumb.is-stamped::before, .photo-thumb.is-stamped::after { display: none; animation: none; } }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .timeline-side { display: none; } .entry { grid-template-columns: 1fr; row-gap: 16px; } .right-col { padding-top: 0; margin-left: 0; } .entry-meta { grid-column: span 1; font-size: 24px; } .page-title { font-size: 42px; } .dust-field { opacity: .78; } .dust-field span:nth-child(n+7) { display: none; } .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } .photo-grid.photo-layout-single { grid-template-columns: 1fr; } .photo-grid.photo-layout-2x2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .photo-thumb, .photo-grid.photo-layout-single .photo-thumb { width: 100%; height: 120px; } .photo-grid.photo-layout-single .photo-thumb { height: min(72vw, 360px); } .video-cell { width: 100%; height: 120px; } .entry-note { max-width: none; padding-left: 18px; } }
  </style>
</head>
<body>
  <div class="dust-field" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="page">
    <div class="topline"><div class="site-note">A place to leave traces.</div><a href="#" class="search-btn" aria-label="Search" id="search-icon">⌕</a></div>
    <div class="title-wrap"><h1 class="page-title">Horse Riding</h1><a href="into-the-wild.html" class="back-link">← Back</a></div>
    <div class="layout"><div class="timeline-side"><div class="timeline-line"><div class="timeline-top">NEW</div><div class="timeline-bottom">OLD</div></div></div><div class="entries" id="entries"></div></div>
  </div>
  <div class="page-footer">“旷野之上，做自由的牧马人🐎”</div>
  <div id="lightbox" onclick="closeLightbox()"><div class="close-tip">tap anywhere to close</div><img id="lightbox-img" src="" alt="large preview"></div>
  <script>
    function revealTitle(){const title=document.querySelector('.title-wrap');if(!title)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){title.classList.add('is-visible');return;}requestAnimationFrame(()=>title.classList.add('is-visible'));}
    function setupEntryReveal(){const entries=document.querySelectorAll('.entry');if(!entries.length)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver'in window)){entries.forEach(entry=>entry.classList.add('is-visible'));return;}const observer=new IntersectionObserver(items=>{items.forEach(item=>{if(item.isIntersecting){item.target.classList.add('is-visible');observer.unobserve(item.target);}});},{threshold:.15,rootMargin:'0px 0px -6% 0px'});entries.forEach(entry=>observer.observe(entry));}
    function setupTouchHorseSeal(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(!window.matchMedia('(hover: none), (pointer: coarse)').matches)return;document.querySelectorAll('.photo-thumb').forEach(target=>{target.addEventListener('pointerdown',()=>{target.classList.remove('is-stamped');void target.offsetWidth;target.classList.add('is-stamped');clearTimeout(target._horseTimer);target._horseTimer=setTimeout(()=>target.classList.remove('is-stamped'),2200);},{passive:true});});}
    function openLightbox(src){const lb=document.getElementById('lightbox');const lbImg=document.getElementById('lightbox-img');lbImg.src=src;lb.classList.remove('is-open');requestAnimationFrame(()=>lb.classList.add('is-open'));}
    async function loadEntries(){const res=await fetch('/horse-riding.json');const data=await res.json();data.entries.sort((a,b)=>{const da=(a.date||'').replace(/\./g,'');const db=(b.date||'').replace(/\./g,'');return db.localeCompare(da);});const container=document.getElementById('entries');data.entries.forEach(e=>{const photos=e.photos||[];const photoLayout=photos.length===1?'photo-layout-single':((photos.length===2||photos.length===4)?'photo-layout-2x2':'photo-layout-3x3');const photosHtml=photos.map(p=>`<span class="photo-thumb"><img src="${p}" class="zoomable"></span>`).join('');const videosHtml=(e.videos||[]).map(bvid=>`<div class="video-cell"><iframe src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=0" allowfullscreen></iframe></div>`).join('');container.innerHTML+=`<div class="entry"><div class="entry-meta"><span class="dot">•</span>${e.date}${e.location?'<br><span class="entry-location">📍 '+e.location+'</span>':''}</div><div class="middle-col"><div class="photo-grid ${photoLayout}">${photosHtml}${videosHtml}</div></div><div class="right-col"><div class="entry-note">${e.note||''}</div></div></div>`;});setupEntryReveal();setupTouchHorseSeal();document.querySelectorAll('.zoomable').forEach(img=>{img.addEventListener('click',function(ev){ev.stopPropagation();openLightbox(this.src);});});}
    revealTitle();loadEntries();function closeLightbox(){document.getElementById('lightbox').classList.remove('is-open');}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
  </script>
  <script data-goatcounter="https://kiara-mytrace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script src="/search.js"></script>
</body>
</html>
