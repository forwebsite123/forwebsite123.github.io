<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>见木</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fcfbf8;
      color: #6e4a4a;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      overflow-x: hidden;
    }
    .page {
      max-width: 800px;
      margin: 0 auto;
      padding: 42px 24px 96px;
      position: relative;
    }
    .topbar {
      margin-bottom: 28px;
    }
    .small-title {
      font-size: 18px;
      letter-spacing: 0.3px;
      color: #7a5757;
    }
    .back-link {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: rgba(122, 87, 87, 0.74);
      font-size: 15px;
    }
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .hero-title {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #8b5e5e;
    }
    .hero-subtitle {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.95;
      color: rgba(122, 87, 87, 0.64);
      font-style: italic;
      letter-spacing: 0.02em;
    }
    .story-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 220px;
      margin-top: 8px;
    }
    .story-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.94) 0%, rgba(255,251,249,0.92) 100%);
      border: 1px solid rgba(156, 115, 115, 0.10);
      border-radius: 22px;
      padding: 22px 24px 18px;
      box-shadow: 0 14px 34px rgba(122, 87, 87, 0.045);
      position: relative;
      overflow: hidden;
      min-height: 198px;
      display: flex;
      flex-direction: column;
    }
    .story-card {
      opacity: 0;
      transform: translateY(10px);
      filter: blur(5px);
      transition: opacity 1.1s ease-out, transform 1.1s ease-out, filter 1.1s ease-out;
    }
    .story-card.is-visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .story-card {
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
    .story-card::before {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(156,115,115,0) 0%, rgba(156,115,115,0.14) 18%, rgba(156,115,115,0.14) 82%, rgba(156,115,115,0) 100%);
    }
    .story-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .story-date {
      display: inline-block;
      font-size: 11.5px;
      letter-spacing: 0.12em;
      color: rgba(122, 87, 87, 0.54);
      background: transparent;
      padding: 0;
      border-radius: 0;
      margin-bottom: 0;
      text-transform: uppercase;
    }
    .story-wordcount {
      flex-shrink: 0;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      color: rgba(122, 87, 87, 0.54);
      white-space: nowrap;
      text-align: right;
      padding-top: 1px;
    }
    .story-title {
      margin: 0 0 10px;
      font-size: 23px;
      font-weight: 400;
      color: #875b5b;
      line-height: 1.52;
      letter-spacing: 0.01em;
    }
    .story-content {
      white-space: pre-wrap;
      line-height: 2.02;
      font-size: 15.3px;
      color: rgba(110, 74, 74, 0.88);
      overflow: hidden;
      position: relative;
      max-height: 8.1em;
      transition: max-height 1s cubic-bezier(.22,.61,.36,1);
    }
    .story-card.is-expanded { min-height: 0; }
    .story-content::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2.6em;
      background: linear-gradient(180deg, rgba(252,251,248,0) 0%, rgba(255,251,249,0.92) 100%);
      pointer-events: none;
      transition: opacity .6s ease;
    }
    .story-card.is-expanded .story-content::after {
      opacity: 0;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .story-content { transition: none !important; }
    }
    .story-more {
      margin-top: 16px;
      align-self: flex-start;
      border: none;
      background: transparent;
      color: #987171;
      font-size: 13.5px;
      line-height: 1.2;
      padding: 0 0 2px;
      cursor: pointer;
      font-family: inherit;
      border-bottom: 1px solid rgba(156,115,115,0.18);
      letter-spacing: 0.06em;
    }
    .story-more:hover { opacity: 0.78; }
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      line-height: 1.9;
      color: rgba(122, 87, 87, 0.62);
      border: 1px solid rgba(156, 115, 115, 0.10);
      border-radius: 22px;
      background: rgba(255,255,255,0.76);
      box-shadow: 0 10px 24px rgba(122, 87, 87, 0.03);
    }
    .page-footer {
      text-align: center;
      margin-top: 72px;
      font-size: 14px;
      font-style: italic;
      letter-spacing: 1px;
      color: rgba(122, 87, 87, 0.7);
    }
    body.jianmu-locked .page {
      visibility: hidden;
    }
    .gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      background: rgba(252, 251, 248, 0.76);
      backdrop-filter: blur(10px);
      opacity: 1;
      transition: opacity 1.1s ease-out, filter 1.1s ease-out, transform 1.1s ease-out;
      animation: none;
    }
    .gate-overlay.is-dissolving {
      opacity: 0;
      filter: blur(22px);
      transform: scale(1.05);
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-overlay { transition: none !important; animation: none !important; }
    }
    .gate-card {
      width: min(100%, 520px);
      max-height: min(88vh, 860px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,251,249,0.94) 100%);
      border: 1px solid rgba(156, 115, 115, 0.14);
      border-radius: 22px;
      padding: 24px 24px 20px;
      box-shadow: 0 18px 48px rgba(122, 87, 87, 0.08);
    }
    .gate-eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(122, 87, 87, 0.5);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .gate-title {
      margin: 0;
      font-size: 25px;
      font-weight: 400;
      color: #8b5e5e;
    }
    .gate-hint-global {
      margin-top: 8px;
      line-height: 1.85;
      font-size: 14px;
      color: rgba(122, 87, 87, 0.72);
    }
    .question-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .question-item {
      border: 1px solid rgba(156, 115, 115, 0.10);
      background: rgba(252,251,248,0.98);
      border-radius: 18px;
      padding: 15px 15px 14px;
    }
    .question-label {
      font-size: 16px;
      line-height: 1.85;
      color: #875f5f;
      margin-bottom: 5px;
    }
    .question-note {
      font-size: 12px;
      color: rgba(122, 87, 87, 0.58);
      margin-bottom: 8px;
      line-height: 1.7;
    }
    .gate-input {
      width: 100%;
      border: 1px solid rgba(156, 115, 115, 0.18);
      border-radius: 12px;
      padding: 11px 13px;
      background: rgba(255,255,255,0.96);
      color: #6e4a4a;
      font-size: 15px;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      outline: none;
    }
    .gate-input:focus {
      border-color: rgba(156, 115, 115, 0.34);
      box-shadow: 0 0 0 3px rgba(156, 115, 115, 0.06);
    }
    .gate-actions {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .gate-submit {
      border: none;
      background: #9c7373;
      color: #fff;
      border-radius: 999px;
      padding: 11px 22px;
      font-size: 14px;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(156, 115, 115, 0.14);
      font-family: inherit;
    }
    .gate-submit:disabled {
      opacity: 0.72;
      cursor: wait;
    }
    .gate-error {
      min-height: 20px;
      font-size: 13px;
      color: #a26060;
      line-height: 1.6;
    }
    .gate-soft-note {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(122, 87, 87, 0.50);
      line-height: 1.7;
    }
    .jianmu-audio-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10002;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(122, 87, 87, 0.16);
      border-radius: 999px;
      background: rgba(255, 251, 249, 0.72);
      color: rgba(122, 87, 87, 0.54);
      box-shadow: 0 10px 26px rgba(122, 87, 87, 0.06);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
      transition: opacity .55s ease, color .35s ease, background .35s ease, transform .35s ease;
    }
    .jianmu-audio-toggle.is-visible {
      opacity: .62;
      pointer-events: auto;
    }
    .jianmu-audio-toggle.is-playing {
      color: rgba(122, 87, 87, 0.72);
      background: rgba(255, 251, 249, 0.82);
    }
    .jianmu-audio-toggle:hover {
      opacity: .92;
      transform: translateY(-1px);
    }
    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .page { padding: 30px 18px 72px; }
      .small-title { font-size: 16px; }
      .back-link { margin-top: 10px; font-size: 14px; }
      .hero { margin-bottom: 22px; }
      .hero-title { font-size: 38px; }
      .hero-subtitle { font-size: 13px; }
      .story-list { gap: 14px; }
      .story-card { border-radius: 18px; padding: 18px 18px 16px; min-height: 186px; }
      .story-title { font-size: 20px; line-height: 1.5; }
      .story-content { font-size: 15px; }
      .story-more { margin-top: 14px; font-size: 12.5px; }
      .gate-card { padding: 20px 16px 18px; border-radius: 22px; }
      .gate-title { font-size: 24px; }
      .question-item { padding: 12px 12px 11px; }
      .question-label { font-size: 16px; }
    }


@view-transition {
  navigation: auto;
}

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: .6s;
  animation-timing-function: ease-in-out;
}
::view-transition-old(root) { animation-name: vt-fade-out; }
::view-transition-new(root) { animation-name: vt-fade-in; }

@keyframes vt-fade-out { from{opacity:1;filter:blur(0)} to{opacity:0;filter:blur(6px)} }
@keyframes vt-fade-in  { from{opacity:0;filter:blur(6px)} to{opacity:1;filter:blur(0)} }
  </style>
</head>
<body class="jianmu-locked">
  <div class="page">
    <div class="topbar">
      <div class="small-title">A place to leave traces.</div>
      <a href="home" class="back-link">← Back</a>
    </div>

    <header class="hero">
      <h1 class="hero-title">展字如晤</h1>
      <div class="hero-subtitle">把一些不适合陈列在橱窗里的文字与思考，安静地放回树影里。</div>
    </header>

    <main class="story-list" id="story-list">
      <div class="empty-state">正在等待解锁。</div>
    </main>

    <div class="page-footer">“枝叶会记住风经过时的方向。”</div>
  </div>

  <div class="gate-overlay" id="jianmu-gate" aria-hidden="false">
    <div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="jianmu-gate-title">
      <div class="gate-eyebrow">Private corner</div>
      <h2 class="gate-title" id="jianmu-gate-title">见木</h2>
      <div class="gate-hint-global" id="gate-hint-global">请回答下面的问题，全部答对后才能看见我的文字哦。</div>
      <div class="question-list" id="question-list"></div>
      <div class="gate-actions">
        <button class="gate-submit" type="button" id="jianmu-submit">查看故事</button>
        <div class="gate-error" id="jianmu-error"></div>
      </div>
    </div>
  </div>

  <button class="jianmu-audio-toggle" type="button" id="jianmu-audio-toggle" aria-label="打开见木背景音乐" aria-pressed="false">♪</button>

  <script>
    /*
      用本地 helper 重新生成下面这段配置后，再替换到这里。
      questions 只是公开提示，不含真实答案；真正要替换的是整个 JIANMU_LOCK。
    */
    let JIANMU_LOCK = null;

    const JIANMU_AUDIO_SRC = 'audio/jianmu-bgm-guqin-reflection-420785.mp3';
    const JIANMU_AUDIO_VOLUME = 0.14;
    const JIANMU_AUDIO_FADE_IN = 1600;
    const JIANMU_AUDIO_FADE_OUT = 650;
    const JIANMU_AUDIO_TIME_KEY = 'jianmu-bgm-current-time';
    const JIANMU_AUDIO_MUTED_KEY = 'jianmu-bgm-muted';

    function clampAudioVolume(value) {
      return Math.max(0, Math.min(1, value));
    }

    function fadeJianmuAudio(audio, fromVolume, toVolume, duration) {
      if (!audio || duration <= 0) {
        if (audio) audio.volume = clampAudioVolume(toVolume);
        return;
      }
      const startedAt = window.performance.now();
      const start = clampAudioVolume(fromVolume);
      const end = clampAudioVolume(toVolume);

      function tick(now) {
        const progress = Math.min(1, (now - startedAt) / duration);
        const eased = 1 - Math.pow(1 - progress, 2);
        audio.volume = clampAudioVolume(start + (end - start) * eased);
        if (progress < 1) window.requestAnimationFrame(tick);
      }

      window.requestAnimationFrame(tick);
    }

    function bootJianmuAudio() {
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const toggle = document.getElementById('jianmu-audio-toggle');
      const audio = new Audio(JIANMU_AUDIO_SRC);
      audio.loop = true;
      audio.preload = 'auto';
      audio.volume = 0;
      audio.setAttribute('playsinline', '');
      audio.setAttribute('aria-hidden', 'true');

      let savedPositionApplied = false;
      let mutedByUser = localStorage.getItem(JIANMU_AUDIO_MUTED_KEY) === 'true';

      function applySavedPosition() {
        if (savedPositionApplied) return;
        const savedTime = Number(localStorage.getItem(JIANMU_AUDIO_TIME_KEY));
        if (Number.isFinite(savedTime) && savedTime > 0) {
          try {
            audio.currentTime = Number.isFinite(audio.duration) && audio.duration > 0
              ? savedTime % audio.duration
              : savedTime;
          } catch (err) {}
        }
        savedPositionApplied = true;
      }

      function persistPosition() {
        if (!audio.paused && Number.isFinite(audio.currentTime)) {
          localStorage.setItem(JIANMU_AUDIO_TIME_KEY, String(audio.currentTime));
        }
      }

      function updateToggle(visible) {
        if (!toggle) return;
        if (visible) toggle.classList.add('is-visible');
        toggle.classList.toggle('is-playing', !audio.paused && !mutedByUser);
        toggle.textContent = !audio.paused && !mutedByUser ? '♫' : '♪';
        toggle.setAttribute('aria-pressed', String(!audio.paused && !mutedByUser));
        toggle.setAttribute('aria-label', !audio.paused && !mutedByUser ? '关闭见木背景音乐' : '打开见木背景音乐');
      }

      function startAudio(showToggleAfterStart) {
        if (mutedByUser || reduceMotion) {
          updateToggle(true);
          return Promise.resolve(false);
        }
        applySavedPosition();
        const playPromise = audio.play();
        if (!playPromise || typeof playPromise.then !== 'function') {
          fadeJianmuAudio(audio, audio.volume, JIANMU_AUDIO_VOLUME, JIANMU_AUDIO_FADE_IN);
          updateToggle(showToggleAfterStart);
          return Promise.resolve(true);
        }
        return playPromise.then(() => {
          fadeJianmuAudio(audio, audio.volume, JIANMU_AUDIO_VOLUME, JIANMU_AUDIO_FADE_IN);
          updateToggle(showToggleAfterStart);
          return true;
        }).catch(() => {
          updateToggle(true);
          bindFirstGestureFallback();
          return false;
        });
      }

      function pauseAudio() {
        mutedByUser = true;
        localStorage.setItem(JIANMU_AUDIO_MUTED_KEY, 'true');
        persistPosition();
        fadeJianmuAudio(audio, audio.volume, 0, JIANMU_AUDIO_FADE_OUT);
        window.setTimeout(() => {
          audio.pause();
          updateToggle(true);
        }, JIANMU_AUDIO_FADE_OUT + 40);
      }

      function resumeAudio() {
        mutedByUser = false;
        localStorage.setItem(JIANMU_AUDIO_MUTED_KEY, 'false');
        startAudio(true);
      }

      function bindFirstGestureFallback() {
        const options = { once: true, passive: true };
        const retry = () => startAudio(true);
        document.addEventListener('pointerdown', retry, options);
        document.addEventListener('keydown', retry, options);
        document.addEventListener('touchstart', retry, options);
      }

      function interceptLeavingLinks() {
        document.addEventListener('click', function(event) {
          const link = event.target.closest('a[href]');
          if (!link) return;
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
          if (link.target && link.target !== '_self') return;
          if (link.hasAttribute('download')) return;

          const url = new URL(link.getAttribute('href'), window.location.href);
          if (url.origin !== window.location.origin) return;
          if (url.href === window.location.href || url.hash && url.pathname === window.location.pathname) return;

          persistPosition();
          if (audio.paused || mutedByUser) return;
          event.preventDefault();
          fadeJianmuAudio(audio, audio.volume, 0, JIANMU_AUDIO_FADE_OUT);
          window.setTimeout(() => {
            window.location.href = url.href;
          }, JIANMU_AUDIO_FADE_OUT + 40);
        });
      }

      if (toggle) {
        toggle.addEventListener('click', function(event) {
          event.preventDefault();
          event.stopPropagation();
          if (!audio.paused && !mutedByUser) pauseAudio();
          else resumeAudio();
        });
      }

      audio.addEventListener('loadedmetadata', applySavedPosition, { once: true });
      audio.addEventListener('play', () => updateToggle(true));
      audio.addEventListener('pause', () => updateToggle(true));
      window.setInterval(persistPosition, 650);
      window.addEventListener('pagehide', persistPosition);
      window.addEventListener('beforeunload', persistPosition);
      interceptLeavingLinks();
      startAudio(false);
    }

    
    async function loadLockConfig() {
      const response = await fetch('jianmu-lock.json', { cache: 'no-store' });
      if (!response.ok) {
        throw new Error('lock-config-missing');
      }
      const data = await response.json();
      if (!data || typeof data !== 'object') {
        throw new Error('lock-config-invalid');
      }
      return data;
    }

    function showLockConfigError() {
      const globalHint = document.getElementById('gate-hint-global');
      const list = document.getElementById('question-list');
      const error = document.getElementById('jianmu-error');
      if (globalHint) globalHint.textContent = '见木配置没有读取成功，请稍后再试。';
      if (list) list.innerHTML = '';
      if (error) error.textContent = '缺少 jianmu-lock.json，或文件内容无效。';
      const button = document.getElementById('jianmu-submit');
      if (button) button.disabled = true;
    }

    function normalizeDateValue(value) {
      return String(value || '').replace(/\./g, '-');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function countDisplayChars(value) {
      return String(value || '').replace(/\s/g, '').length;
    }

    function renderStories(posts) {
      const list = document.getElementById('story-list');
      const ordered = [...posts].sort((a, b) => normalizeDateValue(b.date).localeCompare(normalizeDateValue(a.date)));
      if (!ordered.length) {
        list.innerHTML = '<div class="empty-state">故事页已经准备好了。<br>等你把自己的内容加密放进去之后，它们就会按日期从新到旧出现。</div>';
        return;
      }
      list.innerHTML = ordered.map((post, index) => {
        const title = post.title ? `<h2 class="story-title">${escapeHtml(post.title)}</h2>` : '';
        const wordCount = countDisplayChars(post.content || '');
        return `
          <article class="story-card" data-story-card data-story-id="${index}" style="transition-delay:${index * 130}ms">
            <div class="story-topline">
              <div class="story-date">${escapeHtml(post.date || '')}</div>
              <div class="story-wordcount">共${wordCount}字</div>
            </div>
            ${title}
            <div class="story-content">${escapeHtml(post.content || '')}</div>
            <button class="story-more" type="button" data-toggle-story>阅读全文</button>
          </article>
        `;
      }).join('');

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        list.querySelectorAll('.story-card').forEach((card) => card.classList.add('is-visible'));
        return;
      }
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          list.querySelectorAll('.story-card').forEach((card) => card.classList.add('is-visible'));
        });
      });
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    function buildSecretFromAnswers(answers) {
      return answers.map(value => String(value || '').trim()).join('\u241F');
    }

    async function deriveAesKey(secret) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(secret),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: base64ToBytes(JIANMU_LOCK.salt),
          iterations: JIANMU_LOCK.iterations,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function decryptPostsFromAnswers(answers) {
      const secret = buildSecretFromAnswers(answers);
      const key = await deriveAesKey(secret);
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: base64ToBytes(JIANMU_LOCK.iv) },
        key,
        base64ToBytes(JIANMU_LOCK.payload)
      );
      const text = new TextDecoder().decode(decrypted);
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('invalid-content');
      return data;
    }

    function bindStoryToggles() {
      const list = document.getElementById('story-list');
      if (list.dataset.toggleBound === 'true') return;
      list.dataset.toggleBound = 'true';
      list.addEventListener('click', function(event) {
        const btn = event.target.closest('[data-toggle-story]');
        if (!btn) return;
        const card = btn.closest('[data-story-card]');
        if (!card) return;
        const content = card.querySelector('.story-content');
        const expanding = !card.classList.contains('is-expanded');

        if (content) {
          if (expanding) {
            content.style.maxHeight = content.scrollHeight + 'px';
          } else {
            content.style.maxHeight = '';
          }
        }
        card.classList.toggle('is-expanded', expanding);
        btn.textContent = expanding ? '收起全文' : '阅读全文';
      });
    }

    function renderQuestions() {
      const list = document.getElementById('question-list');
      const questions = Array.isArray(JIANMU_LOCK.questions) && JIANMU_LOCK.questions.length
        ? JIANMU_LOCK.questions
        : [{ question: '请输入密码', hint: '请输入答案', placeholder: '答案' }];

      list.innerHTML = questions.map((item, index) => `
        <div class="question-item">
          <div class="question-label">${escapeHtml(item.question || `问题 ${index + 1}`)}</div>
          <div class="question-note">${escapeHtml(item.hint || '')}</div>
          <input
            class="gate-input gate-answer"
            type="password"
            autocomplete="off"
            placeholder="${escapeHtml(item.placeholder || '请输入答案')}"
            data-index="${index}"
          />
        </div>
      `).join('');

      const first = list.querySelector('.gate-answer');
      setTimeout(() => { if (first) first.focus(); }, 60);
    }

    async function unlockStories() {
      const error = document.getElementById('jianmu-error');
      const button = document.getElementById('jianmu-submit');
      const inputs = Array.from(document.querySelectorAll('.gate-answer'));
      const values = inputs.map(input => input.value.trim());

      if (!values.length || values.some(value => !value)) {
        error.textContent = '请先把所有答案都填完。';
        return;
      }

      button.disabled = true;
      error.textContent = '正在核对…';

      try {
        const posts = await decryptPostsFromAnswers(values);
        renderStories(posts);
        document.body.classList.remove('jianmu-locked');
        const gate = document.getElementById('jianmu-gate');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) {
          gate.classList.add('hidden');
        } else {
          gate.classList.add('is-dissolving');
          setTimeout(() => { gate.classList.add('hidden'); }, 1100);
        }
        inputs.forEach(input => input.value = '');
      } catch (err) {
        error.textContent = '答案不对，再想想。';
      } finally {
        button.disabled = false;
      }
    }

    bootJianmuAudio();
    bindStoryToggles();
    document.getElementById('jianmu-submit').addEventListener('click', unlockStories);
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter' && !document.getElementById('jianmu-gate').classList.contains('hidden')) {
        unlockStories();
      }
    });

    (async function initJianmu() {
      try {
        JIANMU_LOCK = await loadLockConfig();
        renderQuestions();
      } catch (err) {
        showLockConfigError();
      }
    })();
  </script>
  <script data-goatcounter="https://kiara-mytrace.goatcounter.com/count" 
            async src="https://gc.zgo.at/count.js"></script>
</body>
