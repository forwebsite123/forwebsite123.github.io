name: Apply dopamine receipt animations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dopamine-animations.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch dopamine receipts page
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('site/dopamine-receipts.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Receipt Pulse / dopamine ledger animation layer */'
          css = r'''

    /* Receipt Pulse / dopamine ledger animation layer */
    @keyframes receiptPaperIn {
      0% { opacity: 0; transform: translateY(12px); filter: blur(1.6px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .data-section.visible .stats-bar,
    .data-section.visible .filter-row,
    .data-section.visible .footer-note {
      animation: receiptPaperIn .68s cubic-bezier(.18,.72,.22,1) both;
    }

    .data-section.visible .filter-row { animation-delay: .08s; }

    .stat-cell { position: relative; overflow: hidden; }
    .stat-cell::after {
      content: '';
      position: absolute;
      left: 20%; right: 20%; bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139,94,94,.22), transparent);
      opacity: 0;
      transition: opacity .32s ease;
    }
    .stat-cell:hover::after { opacity: 1; }
    .stat-value { transition: text-shadow .28s ease, color .28s ease; }
    .stat-cell:hover .stat-value { text-shadow: 0 8px 22px rgba(139,94,94,.14); }

    .filter-btn {
      transition: border-color .18s ease, color .18s ease, background .18s ease, transform .14s ease, box-shadow .18s ease;
    }
    .filter-btn:active { transform: translateY(1px) scale(.985); box-shadow: inset 0 2px 5px rgba(107,79,79,.10); }
    .filter-btn.active { box-shadow: 0 6px 16px rgba(107,79,79,.08); }

    .grid .card {
      opacity: 0;
      animation: receiptPaperIn .62s cubic-bezier(.18,.72,.22,1) both;
      transition: box-shadow .28s ease, transform .2s ease, border-color .28s ease, background .28s ease;
    }
    .grid .card:nth-child(1) { animation-delay: .03s; }
    .grid .card:nth-child(2) { animation-delay: .08s; }
    .grid .card:nth-child(3) { animation-delay: .13s; }
    .grid .card:nth-child(4) { animation-delay: .18s; }
    .grid .card:nth-child(5) { animation-delay: .23s; }
    .grid .card:nth-child(6) { animation-delay: .28s; }
    .grid .card:nth-child(n+7) { animation-delay: .32s; }

    .grid .card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.62), transparent 46%),
        linear-gradient(115deg, transparent 0%, rgba(255,250,247,.28) 38%, rgba(255,255,255,.44) 50%, transparent 68%);
      transform: translateX(-72%);
      transition: opacity .32s ease, transform .74s cubic-bezier(.18,.72,.22,1);
    }
    .grid .card:hover::before,
    .grid .card:focus-within::before { opacity: 1; transform: translateX(72%); }
    .grid .card > * { position: relative; z-index: 1; }
    .grid .card:hover {
      border-color: rgba(139,94,94,.22);
      background: rgba(255,255,255,.82);
      box-shadow: 0 14px 30px rgba(122,87,87,.08);
      transform: translateY(-3px);
    }
    .card-duration { transform-origin: left center; transition: transform .28s ease, text-shadow .28s ease; }
    .grid .card:hover .card-duration { transform: translateY(-1px) scale(1.015); text-shadow: 0 8px 18px rgba(139,94,94,.12); }

    .modal-overlay.open .modal { animation: receiptPaperIn .36s cubic-bezier(.18,.72,.22,1) both; }

    @media (prefers-reduced-motion: reduce) {
      .data-section.visible .stats-bar,
      .data-section.visible .filter-row,
      .data-section.visible .footer-note,
      .grid .card,
      .modal-overlay.open .modal {
        opacity: 1 !important;
        animation: none !important;
        filter: none !important;
        transform: none !important;
      }
      .grid .card::before,
      .stat-cell::after { transition: none !important; }
    }
'''
          if marker not in s:
              insert_at = '    @media (max-width: 860px) {'
              if insert_at not in s:
                  raise SystemExit('insert marker not found')
              s = s.replace(insert_at, css + '\n' + insert_at, 1)
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-dopamine-animations.yml').unlink(missing_ok=True)
          PY
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/dopamine-receipts.html .github/workflows/apply-dopamine-animations.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add dopamine receipts animations"
            git push
          fi
