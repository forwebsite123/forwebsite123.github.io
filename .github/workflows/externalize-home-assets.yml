name: One-time externalize home assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/externalize-home-assets.yml'

permissions:
  contents: write

jobs:
  externalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract embedded home images and update home.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          home = Path('site/home.html')
          text = home.read_text(encoding='utf-8')
          pattern = re.compile(r'src="data:(image/[^;]+);base64,([^"]+)"')
          matches = list(pattern.finditer(text))

          workflow = Path('.github/workflows/externalize-home-assets.yml')

          if len(matches) == 0:
              print('home.html already has no embedded data:image src values.')
              workflow.unlink(missing_ok=True)
          elif len(matches) != 9:
              raise SystemExit(f'Expected 9 embedded image src values, found {len(matches)}; refusing to change home.html.')
          else:
              save_map = [
                  'site/images/home/home-flora-tl.png',
                  'site/images/home/home-flora-tr.png',
                  'site/images/home/home-flora-br.png',
                  'site/images/home/home-flora-bl.png',
                  'site/images/home/home-card-ornament.png',
                  'site/images/home/home-card-ornament.png',
                  'site/images/home/home-card-ornament.png',
                  'site/images/home/home-card-ornament.png',
                  'site/images/home/home-growth-tree-main.png',
              ]
              src_map = [
                  '/images/home/home-flora-tl.png',
                  '/images/home/home-flora-tr.png',
                  '/images/home/home-flora-br.png',
                  '/images/home/home-flora-bl.png',
                  '/images/home/home-card-ornament.png',
                  '/images/home/home-card-ornament.png',
                  '/images/home/home-card-ornament.png',
                  '/images/home/home-card-ornament.png',
                  '/images/home/home-growth-tree-main.png',
              ]
              expected_sha1 = {
                  'site/images/home/home-flora-tl.png': '761ca46f0e05e93e94e98b080ab07cfa03a15b2e',
                  'site/images/home/home-flora-tr.png': 'b2b628158a47fd34524ab6dec7aaaddd4c46cb88',
                  'site/images/home/home-flora-br.png': 'c789951aed0d5c485a3af27b47feb7c4f9acb9a8',
                  'site/images/home/home-flora-bl.png': '1571b94ee409783627ace662b7f821b61f5f9d3b',
                  'site/images/home/home-card-ornament.png': '52cc84ab6190ed370aacaf06a734aa3b15edf165',
                  'site/images/home/home-growth-tree-main.png': '42e1deb049cf587f96370add8617e523dc1510b0',
              }

              written = {}
              for i, match in enumerate(matches):
                  mime, b64 = match.group(1), match.group(2)
                  if mime != 'image/png':
                      raise SystemExit(f'Unexpected image mime at #{i+1}: {mime}')
                  data = base64.b64decode(b64)
                  path = Path(save_map[i])
                  sha1 = hashlib.sha1(data).hexdigest()
                  expected = expected_sha1[str(path)]
                  if sha1 != expected:
                      raise SystemExit(f'SHA1 mismatch for {path}: {sha1} != {expected}')
                  if path in written:
                      if written[path] != sha1:
                          raise SystemExit(f'Duplicate target has different content: {path}')
                      continue
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  written[path] = sha1
                  print(f'wrote {path} ({len(data)} bytes)')

              index = 0
              def replace_src(match):
                  nonlocal_index[0] += 1
                  return f'src="{src_map[nonlocal_index[0] - 1]}"'

              nonlocal_index = [0]
              new_text = pattern.sub(replace_src, text)
              if 'data:image/' in new_text:
                  raise SystemExit('data:image still present after replacement; refusing to write.')
              for needle in ['treeBreath', '@keyframes swing', '@keyframes fall', 'latest-updates.js', 'search.js']:
                  if needle not in new_text:
                      raise SystemExit(f'Missing preserved marker after rewrite: {needle}')
              home.write_text(new_text, encoding='utf-8')
              workflow.unlink(missing_ok=True)
              print('home.html rewritten with external image src values only.')
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/home.html site/images/home .github/workflows/externalize-home-assets.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Externalize home page embedded images"
            git push
          fi
